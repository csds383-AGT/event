services:
  artists-db:
    build: services/artists/db
    environment:
      POSTGRES_USER: artists
      POSTGRES_PASSWORD: artists
      POSTGRES_DB: artists
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - artists-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "artists"]
      interval: 2s
      retries: 15
    networks:
      - artists_db_net

  artists:
    build:
      context: .
      dockerfile: services/artists/Dockerfile
    environment:
      DATABASE_URL: postgresql://artists:artists@artists-db:5432/artists
      BIND_ADDRESS: 172.30.83.50
      GATEWAY_IP: 172.30.83.30
      PEER_IPS: 172.30.83.40
      CONCERTS_HOST: concerts
    networks:
      app_net:
        ipv4_address: 172.30.83.50
      artists_db_net:
    depends_on:
      artists-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: services/artists/service.py
          target: /festhub/service.py
        - action: sync+restart
          path: services/artists/server.py
          target: /festhub/server.py
        - action: sync+restart
          path: common
          target: /festhub/common
        - action: rebuild
          path: services/concerts/concerts.proto
        - action: rebuild
          path: services/artists/artists.proto
        - action: rebuild
          path: services/categories/categories.proto
        - action: rebuild
          path: services/media/media.proto
        - action: rebuild
          path: requirements.txt

  concerts-db:
    build: services/concerts/db
    environment:
      POSTGRES_USER: concerts
      POSTGRES_PASSWORD: concerts
      POSTGRES_DB: concerts
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - concerts-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "concerts"]
      interval: 2s
      retries: 15
    networks:
      - concerts_db_net

  concerts:
    build:
      context: .
      dockerfile: services/concerts/Dockerfile
    environment:
      DATABASE_URL: postgresql://concerts:concerts@concerts-db:5432/concerts
      BIND_ADDRESS: 172.30.83.40
      GATEWAY_IP: 172.30.83.30
      # IPs for artists (.50), categories (.60), and media (.70)
      PEER_IPS: 172.30.83.50,172.30.83.60,172.30.83.70
      ARTISTS_HOST: artists
      CATEGORIES_HOST: categories
      MEDIA_HOST: media
    networks:
      app_net:
        ipv4_address: 172.30.83.40
      concerts_db_net:
    depends_on:
      concerts-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: services/concerts/service.py
          target: /festhub/service.py
        - action: sync+restart
          path: services/concerts/server.py
          target: /festhub/server.py
        - action: sync+restart
          path: common
          target: /festhub/common
        - action: rebuild
          path: services/concerts/concerts.proto
        - action: rebuild
          path: services/artists/artists.proto
        - action: rebuild
          path: services/categories/categories.proto
        - action: rebuild
          path: services/media/media.proto
        - action: rebuild
          path: requirements.txt

  categories-db:
    build: services/categories/db
    environment:
      POSTGRES_USER: categories
      POSTGRES_PASSWORD: categories
      POSTGRES_DB: categories
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - categories-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "categories"]
      interval: 2s
      retries: 15
    networks:
      - categories_db_net

  categories:
    build:
      context: .
      dockerfile: services/categories/Dockerfile
    environment:
      DATABASE_URL: postgresql://categories:categories@categories-db:5432/categories
      BIND_ADDRESS: 172.30.83.60
      GATEWAY_IP: 172.30.83.30
      PEER_IPS: 172.30.83.40
      CONCERTS_HOST: concerts
    networks:
      app_net:
        ipv4_address: 172.30.83.60
      categories_db_net:
    depends_on:
      categories-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: services/categories/service.py
          target: /festhub/service.py
        - action: sync+restart
          path: services/categories/server.py
          target: /festhub/server.py
        - action: sync+restart
          path: common
          target: /festhub/common
        - action: rebuild
          path: services/concerts/concerts.proto
        - action: rebuild
          path: services/artists/artists.proto
        - action: rebuild
          path: services/categories/categories.proto
        - action: rebuild
          path: services/media/media.proto
        - action: rebuild
          path: requirements.txt

  media-db:
    build: services/media/db
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - media-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "media"]
      interval: 2s
      retries: 15
    networks:
      - media_db_net

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    environment:
      DATABASE_URL: postgresql://media:media@media-db:5432/media
      BIND_ADDRESS: 172.30.83.70
      GATEWAY_IP: 172.30.83.30
      # Authorize the concerts container so media can validate event IDs
      PEER_IPS: 172.30.83.40
      CONCERTS_HOST: concerts
    networks:
      app_net:
        ipv4_address: 172.30.83.70
      media_db_net:
    depends_on:
      media-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: services/media/service.py
          target: /festhub/service.py
        - action: sync+restart
          path: services/media/server.py
          target: /festhub/server.py
        - action: sync+restart
          path: common
          target: /festhub/common
        - action: rebuild
          path: services/concerts/concerts.proto
        - action: rebuild
          path: services/artists/artists.proto
        - action: rebuild
          path: services/categories/categories.proto
        - action: rebuild
          path: services/media/media.proto
        - action: rebuild
          path: requirements.txt

  web:
    build:
      context: .
      dockerfile: clients/web/Dockerfile
    environment:
      BUSINESS_HOST: kong
      BUSINESS_PORT: "9080"
      FLASK_DEBUG: "1"
    networks:
      app_net:
        ipv4_address: 172.30.83.10
    depends_on:
      - concerts
      - artists
      - categories
      - media
    develop:
      watch:
        - action: sync
          path: clients/web/web_api.py
          target: /festhub/web_api.py
        - action: sync
          path: clients/web/templates
          target: /festhub/templates
        - action: rebuild
          path: services/concerts/concerts.proto
        - action: rebuild
          path: services/artists/artists.proto
        - action: rebuild
          path: services/categories/categories.proto
        - action: rebuild
          path: services/media/media.proto
        - action: rebuild
          path: requirements.txt

  cli:
    build:
      context: .
      dockerfile: clients/cli/Dockerfile
    environment:
      GATEWAY_HOST: kong
      GATEWAY_PORT: "9080"
    networks:
      - app_net
    depends_on:
      - kong
    profiles:
      - cli
    develop:
      watch:
        - action: sync
          path: clients/cli/cli.py
          target: /festhub/cli.py
        - action: sync
          path: clients/cli/cli_api.py
          target: /festhub/cli_api.py
        - action: rebuild
          path: services/concerts/concerts.proto
        - action: rebuild
          path: services/artists/artists.proto
        - action: rebuild
          path: services/categories/categories.proto
        - action: rebuild
          path: services/media/media.proto
        - action: rebuild
          path: requirements.txt

  kong:
    build: gateway
    environment:
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:9080 http2"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_ANONYMOUS_REPORTS: "off"
    ports:
      - "127.0.0.1:5001:8000"
      - "127.0.0.1:9080:9080"
    networks:
      app_net:
        ipv4_address: 172.30.83.30
    depends_on:
      - artists
      - concerts
      - categories
      - media
      - web
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 2s
      retries: 15
    develop:
      watch:
        - action: rebuild
          path: gateway/kong.yml

  rabbitmq:
    build: broker
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 20
    networks:
      - broker_net
    develop:
      watch:
        - action: rebuild
          path: broker

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        # fixed addresses, so each service can tell kong and its peers apart from anything else on this network
        - subnet: 172.30.83.0/24
          # containers without a fixed address get one from the upper half, so they can't take a fixed one
          ip_range: 172.30.83.128/25
  artists_db_net:
    driver: bridge
  concerts_db_net:
    driver: bridge
  categories_db_net:
    driver: bridge
  media_db_net:
    driver: bridge
  broker_net:
    driver: bridge

volumes:
  artists-db-data:
  concerts-db-data:
  categories-db-data:
  media-db-data:
